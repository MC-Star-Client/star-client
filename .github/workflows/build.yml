name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Performance Client
        working-directory: PerformanceClient-26.3
        run: gradle --no-daemon --stacktrace build

      - name: Build Modern Options
        working-directory: PerformanceClient-26.3/modernoptions
        run: gradle --no-daemon --stacktrace build

      - name: Build Modern Statistics
        working-directory: PerformanceClient-26.3/modernstats
        run: gradle --no-daemon --stacktrace build

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          if-no-files-found: error
          path: |
            PerformanceClient-26.3/build/libs/*.jar
            PerformanceClient-26.3/modernoptions/build/libs/*.jar
            PerformanceClient-26.3/modernstats/build/libs/*.jar

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: jars-ubuntu-latest
          path: artifacts

      - name: Collect mod JARs
        run: |
          mkdir -p release
          find artifacts -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          echo "Gefundene JARs:"
          ls -l release

      - name: Write release notes
        run: |
          {
            echo "Automatisch gebaut aus Commit \`${GITHUB_SHA::7}\` auf \`main\`."
            echo
            echo "Die JARs sind plattformunabhängig — dieselbe Datei läuft unter Windows, Linux und macOS."
            echo "Der Build wird zusätzlich auf allen drei Betriebssystemen geprüft."
            echo
            echo "**Enthaltene Mods**"
            echo
            ls -1 release | sed 's/^/- `/; s/$/`/'
            echo
            echo "**Installation:** JAR zusammen mit [Fabric API](https://modrinth.com/mod/fabric-api) in den"
            echo "\`mods\`-Ordner von Minecraft 26.3 (Fabric Loader) legen."
          } > release-notes.md
          cat release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest Build" --notes-file release-notes.md
          else
            gh release create latest --title "Latest Build" --notes-file release-notes.md
          fi
          gh release upload latest release/*.jar --clobber
